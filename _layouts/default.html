<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121417">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title %}{{ page.title | escape }} — {% endif %}{{ site.title | escape }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    {% feed_meta %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Austin McGaugh home">
        <span class="wordmark-mark" aria-hidden="true">am<span>.</span></span>
        <span class="wordmark-name">Austin McGaugh</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/work/' | relative_url }}"{% if page.url == '/work/' %} aria-current="page"{% endif %}>Work</a>
        <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a class="nav-contact" href="{{ '/contact/' | relative_url }}">Get in touch <span aria-hidden="true">↗</span></a>
      </nav>
    </header>

    <main id="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <a class="footer-mark" href="{{ '/' | relative_url }}">Austin McGaugh <span>© {{ site.time | date: "%Y" }}</span></a>
      <div class="footer-links">
        <a href="https://x.com/AustinMcGaugh" rel="me">X</a>
        <a href="https://www.linkedin.com/in/austinmcgaugh/" rel="me">LinkedIn</a>
        <a href="https://www.youtube.com/@AustinMcGaugh" rel="me">YouTube</a>
        <a href="mailto:{{ site.email }}">Email</a>
      </div>
    </footer>
  </body>
</html>
